# Flux: kgateway CRDs.
# No values.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kgateway-crds
  namespace: flux-system
spec:
  interval: 1h
  url: oci://cr.kgateway.dev/kgateway-dev/charts/kgateway-crds
  ref:
    tag: "v2.3.11" # version: kgateway-crds
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: flux-system
spec:
  releaseName: kgateway-crds
  targetNamespace: kgateway-system
  storageNamespace: kgateway-system
  interval: 30m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: kgateway-crds
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: -1 # keep retrying: other units (or clusters) may still be converging
  upgrade:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
---
# Flux: kgateway, the Gateway API implementation behind every plane gateway.
# Values: values.yaml next to this file (ConfigMap kgateway-values-base), then the
# optional per-cluster ConfigMap kgateway-values (flux/clusters/<name>/values/kgateway.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kgateway
  namespace: flux-system
spec:
  interval: 1h
  url: oci://cr.kgateway.dev/kgateway-dev/charts/kgateway
  ref:
    tag: "v2.3.11" # version: kgateway
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: flux-system
spec:
  releaseName: kgateway
  targetNamespace: kgateway-system
  storageNamespace: kgateway-system
  interval: 30m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: kgateway
  dependsOn:
    - name: kgateway-crds
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: -1 # keep retrying: other units (or clusters) may still be converging
  upgrade:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: kgateway-values-base
    - kind: ConfigMap
      name: kgateway-values # per-cluster values, optional
      optional: true
