# k3d-multi, observability-plane cluster (openchoreo-op): the observability plane and its modules,
# receiving telemetry from the other clusters.
# One Flux Kustomization per unit, ordered with dependsOn inside this cluster. Clusters
# never wait on each other: units that need another cluster stay not-ready (and retry)
# until it has done its part. Fields every unit shares (sourceRef, interval, prune, wait)
# are set once in kustomization.yaml.
---
# shared: what every cluster that runs a plane needs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-gateway-api-crds
  namespace: flux-system
spec:
  path: ./flux/shared/gateway-api-crds
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-cert-manager
  namespace: flux-system
spec:
  path: ./flux/shared/cert-manager
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-external-secrets
  namespace: flux-system
spec:
  path: ./flux/shared/external-secrets
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-kgateway
  namespace: flux-system
spec:
  path: ./flux/shared/kgateway
  timeout: 10m
  dependsOn:
    - name: openchoreo-gateway-api-crds
---
# k3d: this cluster's own OpenBao behind ClusterSecretStore "default", the shared
# trust OpenBao behind "trust", and DNS. On other clusters, replace them with your
# own stores ("default": keys from `scripts/seed-secrets.sh list`; "trust": shared).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-openbao
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/openbao
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-secret-store
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/secret-store
  timeout: 5m
  dependsOn:
    - name: openchoreo-external-secrets
    - name: openchoreo-openbao
---
# Ready once the trust OpenBao on the control-plane cluster answers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-trust-store
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/trust-store
  timeout: 10m
  dependsOn:
    - name: openchoreo-external-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-coredns
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/coredns
  timeout: 5m
---
# observability plane
# The plane waits for its trust ExternalSecret, which resolves once the control plane
# has published its gateway CA: that is how this cluster waits for the control plane.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-observability-plane
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/install
  timeout: 30m
  dependsOn:
    - name: openchoreo-cert-manager
    - name: openchoreo-external-secrets
    - name: openchoreo-kgateway
    - name: openchoreo-secret-store
    - name: openchoreo-trust-store
    - name: openchoreo-coredns
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-observability-modules
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/modules
  timeout: 30m
  dependsOn:
    - name: openchoreo-observability-plane
---
# k3d: OpenSearch for the other clusters' collectors, through the gateway
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-opensearch-route
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/opensearch-route
  timeout: 5m
  dependsOn:
    - name: openchoreo-observability-plane
