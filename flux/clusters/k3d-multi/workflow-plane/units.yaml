# k3d-multi, workflow-plane cluster (openchoreo-wp): the workflow plane, its build templates and the
# k3d registry, plus collectors shipping its logs and events to the observability plane.
# One Flux Kustomization per unit, ordered with dependsOn inside this cluster. Clusters
# never wait on each other: units that need another cluster stay not-ready (and retry)
# until it has done its part. Fields every unit shares (sourceRef, interval, prune, wait)
# are set once in kustomization.yaml.
---
# shared: what the workflow plane needs (no gateway on this cluster)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-cert-manager
  namespace: flux-system
spec:
  path: ./flux/shared/cert-manager
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-external-secrets
  namespace: flux-system
spec:
  path: ./flux/shared/external-secrets
  timeout: 10m
---
# k3d: this cluster's own OpenBao behind ClusterSecretStore "default", the shared
# trust OpenBao behind "trust", and DNS. On other clusters, replace them with your
# own stores ("default": keys from `scripts/seed-secrets.sh list`; "trust": shared).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-openbao
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/openbao
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-secret-store
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/secret-store
  timeout: 5m
  dependsOn:
    - name: openchoreo-external-secrets
    - name: openchoreo-openbao
---
# Ready once the trust OpenBao on the control-plane cluster answers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-trust-store
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/trust-store
  timeout: 10m
  dependsOn:
    - name: openchoreo-external-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-coredns
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/coredns
  timeout: 5m
---
# workflow plane
# The plane waits for its trust ExternalSecret, which resolves once the control plane
# has published its gateway CA: that is how this cluster waits for the control plane.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-plane
  namespace: flux-system
spec:
  path: ./flux/planes/workflow-plane/install
  timeout: 15m
  dependsOn:
    - name: openchoreo-cert-manager
    - name: openchoreo-external-secrets
    - name: openchoreo-secret-store
    - name: openchoreo-trust-store
    - name: openchoreo-coredns
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-templates
  namespace: flux-system
spec:
  path: ./flux/planes/workflow-plane/templates
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
# k3d: in-cluster registry and the build steps that push to it
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-registry
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/registry
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-k3d-workflow-templates
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-multi/k3d/workflow-templates
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
# telemetry to the observability plane on openchoreo-op: logs and events only
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-collector-logs
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/collectors/logs-opensearch
  timeout: 10m
  dependsOn:
    - name: openchoreo-secret-store
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-collector-events
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/collectors/events-otel-collector
  timeout: 10m
  dependsOn:
    - name: openchoreo-collector-logs
