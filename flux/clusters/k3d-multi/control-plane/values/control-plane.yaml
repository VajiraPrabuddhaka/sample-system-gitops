# k3d-multi, control-plane cluster (openchoreo-cp): everything on *.openchoreo.localhost
# through the k3d load balancer, plain HTTP on the ports k3d maps to the host (8080/8443).
# Derived from openchoreo/openchoreo@v1.4.0-m.1:install/k3d/multi-cluster/values-cp.yaml
# (backstage.secretName/features live in the unit's values.yaml).
gateway:
  httpPort: 8080
  httpsPort: 8443
  tls:
    enabled: false
openchoreoApi:
  http:
    hostnames:
    - api.openchoreo.localhost
  config:
    server:
      publicUrl: http://api.openchoreo.localhost:8080
    audit:
      enabled: true
      observabilityPlaneRef:
        kind: ClusterObservabilityPlane
        name: default
backstage:
  features:
    costInsights:
      enabled: true
  baseUrl: http://openchoreo.localhost:8080
  http:
    hostnames:
    - openchoreo.localhost
portalAssistant:
  config:
    observerApiUrl: http://observer.openchoreo.localhost:11080
security:
  oidc:
    issuer: http://thunder.openchoreo.localhost:8080
    jwksUrl: http://thunder.openchoreo.localhost:8080/oauth2/jwks
    authorizationUrl: http://thunder.openchoreo.localhost:8080/oauth2/authorize
    tokenUrl: http://thunder.openchoreo.localhost:8080/oauth2/token
# The agents on the other clusters reach the cluster-gateway through this cluster's
# gateway: TLS passthrough on 8443 for cluster-gateway.openchoreo.localhost, which their
# CoreDNS rewrites to the host (k3d/coredns).
clusterGateway:
  tlsRoute:
    enabled: true
    hosts:
      - host: cluster-gateway.openchoreo.localhost
        paths:
          - path: /
            pathType: Prefix
  tls:
    issuerRef:
      name: cluster-gateway-server-issuer
    dnsNames:
      - cluster-gateway.openchoreo-control-plane.svc
      - cluster-gateway.openchoreo-control-plane.svc.cluster.local
      - cluster-gateway.openchoreo.localhost
