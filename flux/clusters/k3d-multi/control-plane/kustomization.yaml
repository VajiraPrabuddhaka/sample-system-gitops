# Flux entry point for k3d-multi's control-plane cluster (openchoreo-cp): plug.yaml points a Flux
# Kustomization at this directory. It creates one Flux Kustomization per unit (units.yaml)
# and this cluster's Helm values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - units.yaml
# Per-cluster Helm values: ConfigMap <component>-values, which each HelmRelease reads after
# the unit's own values (valuesFrom, optional). Fixed names so the units can find them;
# the watch label makes helm-controller roll the release when one changes (Flux >= 2.5).
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: control-plane-values
    namespace: flux-system
    files:
      - values.yaml=values/control-plane.yaml
  - name: thunder-values
    namespace: flux-system
    files:
      - values.yaml=values/thunder.yaml
patches:
  # Defaults for every unit.
  - target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
    patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: all-units
      spec:
        interval: 10m
        retryInterval: 1m
        prune: true
        wait: true
        sourceRef:
          kind: GitRepository
          name: openchoreo
