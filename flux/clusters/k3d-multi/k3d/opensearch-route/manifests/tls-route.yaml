# Fluent Bit and the events collectors on the other clusters write to this cluster's
# OpenSearch through the observability plane's gateway: TLS passthrough on 11085 for SNI
# opensearch.observability.openchoreo.localhost (gateway.tlsPassthrough in
# values/observability-plane.yaml), on to the logs module's single-node OpenSearch.
# Upstream's multi-cluster guide gets the same route from the logs module's
# operator-managed OpenSearch (openSearchCluster.enabled). That mode reads its credentials
# with Helm lookup, which Argo CD cannot render, and runs five OpenSearch nodes.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: opensearch
  namespace: openchoreo-observability-plane
spec:
  hostnames:
    - opensearch.observability.openchoreo.localhost
  parentRefs:
    - name: gateway-default
      namespace: openchoreo-observability-plane
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: opensearch
          port: 9200
