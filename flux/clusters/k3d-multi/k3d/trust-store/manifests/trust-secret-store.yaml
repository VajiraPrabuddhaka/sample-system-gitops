# The "trust" store: where the trust relay exchanges public CA certificates between the
# control plane and the planes. Every cluster points it at the same OpenBao, the shared
# instance on the control-plane cluster, reached through the host (k3d maps port 8200).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: trust
spec:
  provider:
    vault:
      server: http://host.k3d.internal:8200
      path: secret
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-trust-token
          namespace: external-secrets
          key: token
