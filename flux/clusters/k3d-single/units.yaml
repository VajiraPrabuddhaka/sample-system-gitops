# k3d-single: one Flux Kustomization per unit, ordered with dependsOn. Fields every unit
# shares (sourceRef, interval, prune, wait) are set once in kustomization.yaml.
#
# To run OpenChoreo on another cluster, copy this directory, drop the k3d units, point
# the paths at your own pieces and change values/. The units under flux/shared,
# flux/identity and flux/planes stay as they are.
---
# shared: what every cluster that runs a plane needs
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-gateway-api-crds
  namespace: flux-system
spec:
  path: ./flux/shared/gateway-api-crds
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-cert-manager
  namespace: flux-system
spec:
  path: ./flux/shared/cert-manager
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-external-secrets
  namespace: flux-system
spec:
  path: ./flux/shared/external-secrets
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-kgateway
  namespace: flux-system
spec:
  path: ./flux/shared/kgateway
  timeout: 10m
  dependsOn:
    - name: openchoreo-gateway-api-crds
---
# k3d: secret store and DNS. On another cluster, replace these with your own
# ClusterSecretStore "default" (keys: `scripts/seed-secrets.sh list`).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-openbao
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-single/k3d/openbao
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-secret-store
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-single/k3d/secret-store
  timeout: 5m
  dependsOn:
    - name: openchoreo-external-secrets
    - name: openchoreo-openbao
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-coredns
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-single/k3d/coredns
  timeout: 5m
---
# identity: ThunderID. Drop it if you bring your own IdP (set security.oidc.* in
# values/control-plane.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-identity
  namespace: flux-system
spec:
  path: ./flux/identity
  timeout: 10m
  dependsOn:
    - name: openchoreo-gateway-api-crds
---
# planes. The planes depend on control-plane only to keep a single-cluster install
# orderly; on a cluster of their own they depend on the shared units and the store.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-control-plane
  namespace: flux-system
spec:
  path: ./flux/planes/control-plane/install
  timeout: 20m
  dependsOn:
    - name: openchoreo-cert-manager
    - name: openchoreo-external-secrets
    - name: openchoreo-kgateway
    - name: openchoreo-secret-store
    - name: openchoreo-coredns
    - name: openchoreo-identity
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-data-plane
  namespace: flux-system
spec:
  path: ./flux/planes/data-plane/install
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-plane
  namespace: flux-system
spec:
  path: ./flux/planes/workflow-plane/install
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-observability-plane
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/install
  timeout: 30m
  dependsOn:
    - name: openchoreo-control-plane
---
# add-ons
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-templates
  namespace: flux-system
spec:
  path: ./flux/planes/workflow-plane/templates
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-registry
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-single/k3d/registry
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-k3d-workflow-templates
  namespace: flux-system
spec:
  path: ./flux/clusters/k3d-single/k3d/workflow-templates
  timeout: 5m
  dependsOn:
    - name: openchoreo-workflow-plane
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-observability-modules
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/modules
  timeout: 30m
  dependsOn:
    - name: openchoreo-observability-plane
---
# registration: applied on the control-plane cluster. Ready only when the plane's agent
# is connected through the trust relay (healthCheckExprs needs Flux >= 2.5).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-data-plane-registration
  namespace: flux-system
spec:
  path: ./flux/planes/data-plane/registration
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
    - name: openchoreo-data-plane
  healthCheckExprs:
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterDataPlane
      current: has(status.agentConnection) && status.agentConnection.connected == true
  patches:
    # Where this cluster's data plane serves workloads (k3d load balancer, port 19080).
    - target:
        kind: ClusterDataPlane
        name: default
      patch: |-
        apiVersion: openchoreo.dev/v1alpha1
        kind: ClusterDataPlane
        metadata:
          name: default
        spec:
          gateway:
            ingress:
              external:
                http:
                  host: openchoreoapis.localhost
                  port: 19080
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-workflow-plane-registration
  namespace: flux-system
spec:
  path: ./flux/planes/workflow-plane/registration
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
    - name: openchoreo-workflow-plane
  healthCheckExprs:
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterWorkflowPlane
      current: has(status.agentConnection) && status.agentConnection.connected == true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-observability-plane-registration
  namespace: flux-system
spec:
  path: ./flux/planes/observability-plane/registration
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
    - name: openchoreo-observability-plane
  healthCheckExprs:
    - apiVersion: openchoreo.dev/v1alpha1
      kind: ClusterObservabilityPlane
      current: has(status.agentConnection) && status.agentConnection.connected == true
  patches:
    - target:
        kind: ClusterObservabilityPlane
        name: default
      patch: |-
        apiVersion: openchoreo.dev/v1alpha1
        kind: ClusterObservabilityPlane
        metadata:
          name: default
        spec:
          observerURL: http://observer.openchoreo.localhost:11080
---
# defaults: OpenChoreo's default environments, pipeline and component types (optional).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-platform-defaults
  namespace: flux-system
spec:
  path: ./flux/planes/control-plane/defaults
  timeout: 10m
  dependsOn:
    - name: openchoreo-data-plane-registration
    - name: openchoreo-workflow-plane-registration
    - name: openchoreo-observability-plane-registration
