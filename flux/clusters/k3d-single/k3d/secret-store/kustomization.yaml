# flux/clusters/k3d-single/k3d/secret-store: ClusterSecretStores "default" (secrets the units read; keys:
# `scripts/seed-secrets.sh list`) and "trust" (CA certificates for the trust relay), both
# backed by the in-cluster OpenBao.
# One Flux Kustomization applies this directory (flux/clusters/<name>/units.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests
