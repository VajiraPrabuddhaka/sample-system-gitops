# The "trust" store: where the trust relay exchanges public CA certificates between the
# control plane and the planes (PushSecrets and ExternalSecrets in planes/*/install and
# planes/*/registration). Every cluster of an installation must point "trust" at the
# same backend. With a single cluster that can simply be the same OpenBao as "default".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: trust
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openchoreo-secret-writer-role
          serviceAccountRef:
            name: external-secrets-openbao
            namespace: openbao
