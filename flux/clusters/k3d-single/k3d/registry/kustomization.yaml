# flux/clusters/k3d-single/k3d/registry: image registry for builds (k3d only).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
configMapGenerator:
  - name: registry-values-base
    namespace: flux-system
    files:
      - values.yaml
configurations:
  - ../../../../kustomizeconfig.yaml
