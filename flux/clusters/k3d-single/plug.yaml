# Plug OpenChoreo into a cluster that already runs Flux (>= 2.5): `kubectl apply -f` this
# file, or commit it to the repo your Flux syncs. It points Flux at this repo and at
# flux/clusters/k3d-single, which installs everything else in order (units.yaml).
#
# Fork or mirror: scripts/set-git-source.sh <url> [branch] rewrites url and branch.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
  ref:
    branch: main
  # Only the Flux tree is needed.
  ignore: |
    /*
    !/flux/
  # Private repo: create a Secret with credentials in flux-system and reference it:
  # secretRef:
  #   name: openchoreo-git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openchoreo
  path: ./flux/clusters/k3d-single
  prune: true
  wait: false # the units report progress themselves: kubectl -n flux-system get kustomizations
