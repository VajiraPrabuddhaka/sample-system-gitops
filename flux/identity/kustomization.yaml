# flux/identity: ThunderID identity provider (optional: replace with your own IdP).
# One Flux Kustomization applies this directory (flux/clusters/<name>/units.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
configMapGenerator:
  - name: thunder-values-base
    namespace: flux-system
    files:
      - values.yaml
configurations:
  - ../kustomizeconfig.yaml
