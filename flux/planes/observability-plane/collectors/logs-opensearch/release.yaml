# Flux: telemetry collector logs-opensearch.
# Fluent Bit, shipping this cluster's container logs to the OpenSearch of the
# observability plane on another cluster.
# Values: values.yaml next to this file (ConfigMap collector-logs-opensearch-values-base), then the
# optional per-cluster ConfigMap collector-logs-opensearch-values (flux/clusters/<name>/values/collector-logs-opensearch.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: collector-logs-opensearch
  namespace: flux-system
spec:
  interval: 1h
  url: oci://cr.openchoreo.dev/openchoreo/helm-charts/observability-logs-opensearch
  ref:
    tag: "0.8.1" # version: obs-logs-opensearch
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collector-logs-opensearch
  namespace: flux-system
spec:
  releaseName: observability-logs-opensearch
  targetNamespace: openchoreo-observability-plane
  storageNamespace: openchoreo-observability-plane
  interval: 30m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: collector-logs-opensearch
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: -1 # keep retrying: other units (or clusters) may still be converging
  upgrade:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: collector-logs-opensearch-values-base
    - kind: ConfigMap
      name: collector-logs-opensearch-values # per-cluster values, optional
      optional: true
