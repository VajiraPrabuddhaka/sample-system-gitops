# flux/planes/observability-plane/collectors/events-otel-collector: telemetry collector events-otel-collector.
# One Flux Kustomization applies this directory, alone or through ../kustomization.yaml
# (flux/clusters/<name>/units.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
configMapGenerator:
  - name: collector-events-otel-collector-values-base
    namespace: flux-system
    files:
      - values.yaml
configurations:
  - ../../../../kustomizeconfig.yaml
