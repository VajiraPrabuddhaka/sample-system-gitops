# flux/planes/observability-plane/modules/metrics-prometheus: observability module metrics-prometheus.
# One Flux Kustomization applies this directory (flux/clusters/<name>/units.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - release.yaml
configMapGenerator:
  - name: obs-metrics-prometheus-values-base
    namespace: flux-system
    files:
      - values.yaml
configurations:
  - ../../../../kustomizeconfig.yaml
