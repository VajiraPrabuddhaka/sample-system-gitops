# Flux: observability module metrics-prometheus.
# Values: values.yaml next to this file (ConfigMap obs-metrics-prometheus-values-base), then the
# optional per-cluster ConfigMap obs-metrics-prometheus-values (flux/clusters/<name>/values/obs-metrics-prometheus.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: obs-metrics-prometheus
  namespace: flux-system
spec:
  interval: 1h
  url: oci://cr.openchoreo.dev/openchoreo/helm-charts/observability-metrics-prometheus
  ref:
    tag: "0.9.0" # version: obs-metrics-prometheus
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obs-metrics-prometheus
  namespace: flux-system
spec:
  releaseName: observability-metrics-prometheus
  targetNamespace: openchoreo-observability-plane
  storageNamespace: openchoreo-observability-plane
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: obs-metrics-prometheus
  install:
    createNamespace: true
    crds: Create
    remediation:
      retries: -1 # keep retrying: other units (or clusters) may still be converging
  upgrade:
    crds: Create
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: obs-metrics-prometheus-values-base
    - kind: ConfigMap
      name: obs-metrics-prometheus-values # per-cluster values, optional
      optional: true
