# Flux: OpenChoreo workflow plane (+ trust relay).
# Values: values.yaml next to this file (ConfigMap workflow-plane-values-base), then the
# optional per-cluster ConfigMap workflow-plane-values (flux/clusters/<name>/values/workflow-plane.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: workflow-plane
  namespace: flux-system
spec:
  interval: 1h
  url: oci://cr.openchoreo.dev/openchoreo/helm-charts/openchoreo-workflow-plane
  ref:
    tag: "1.4.0-m.1" # version: workflow-plane
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: workflow-plane
  namespace: flux-system
spec:
  releaseName: openchoreo-workflow-plane
  targetNamespace: openchoreo-workflow-plane
  storageNamespace: openchoreo-workflow-plane
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: workflow-plane
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: -1 # keep retrying: other units (or clusters) may still be converging
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
  valuesFrom:
    - kind: ConfigMap
      name: workflow-plane-values-base
    - kind: ConfigMap
      name: workflow-plane-values # per-cluster values, optional
      optional: true
