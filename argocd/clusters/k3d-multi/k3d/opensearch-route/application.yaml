# Argo CD: TLSRoute exposing the observability plane's OpenSearch to the other
# clusters (observability-plane cluster only).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-opensearch-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      path: argocd/clusters/k3d-multi/k3d/opensearch-route/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
