# Argo CD: in-cluster image registry for k3d builds (twuni/docker-registry).
# Values: values.yaml next to this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-workflow-plane
  sources:
    - repoURL: https://twuni.github.io/docker-registry.helm
      chart: docker-registry
      targetRevision: "3.0.0" # version: registry
      helm:
        releaseName: registry
        valueFiles:
          - $values/argocd/clusters/k3d-multi/k3d/registry/values.yaml
    - repoURL: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
      targetRevision: main
      ref: values
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
