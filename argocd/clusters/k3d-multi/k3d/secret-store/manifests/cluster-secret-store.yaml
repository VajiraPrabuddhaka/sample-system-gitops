# The "default" store every OpenChoreo plane CR and ExternalSecret refers to.
# Uses the writer role so PushSecrets (trust relay, workflow plane) can write.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: default
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: openchoreo-secret-writer-role
          serviceAccountRef:
            name: external-secrets-openbao
            namespace: openbao
