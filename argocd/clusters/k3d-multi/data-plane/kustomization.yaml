# Argo CD entry point for k3d-multi's data-plane cluster (openchoreo-dp):
# the data plane, plus collectors shipping its
# logs, traces, metrics and events to the observability plane.
# root-app.yaml points this cluster's Argo CD at this directory. It lists the units this
# cluster runs (one Application each; order = sync waves) and patches in this cluster's
# Helm values.
# Clusters never wait on each other: a unit that needs another cluster stays unhealthy
# (and retries) until that cluster has done its part.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../shared/helm-repositories
  - ../../../shared/gateway-api-crds
  - ../../../shared/cert-manager
  - ../../../shared/external-secrets
  - ../../../shared/kgateway
  - ../k3d/openbao
  - ../k3d/secret-store
  - ../k3d/trust-store
  - ../k3d/coredns
  - ../../../planes/data-plane/install
  - ../../../planes/observability-plane/collectors
patches:
  # Per-cluster Helm values: appended after the unit's own values.yaml (later wins).
  - target:
      kind: Application
      name: openchoreo-data-plane
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/argocd/clusters/k3d-multi/data-plane/values/data-plane.yaml
  - target:
      kind: Application
      name: openchoreo-collector-logs-opensearch
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/argocd/clusters/k3d-multi/data-plane/values/collector-logs-opensearch.yaml
  - target:
      kind: Application
      name: openchoreo-collector-events-otel-collector
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/argocd/clusters/k3d-multi/data-plane/values/collector-events-otel-collector.yaml
  - target:
      kind: Application
      name: openchoreo-collector-traces-opensearch
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/argocd/clusters/k3d-multi/data-plane/values/collector-traces-opensearch.yaml
  - target:
      kind: Application
      name: openchoreo-collector-metrics-prometheus
    patch: |-
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/argocd/clusters/k3d-multi/data-plane/values/collector-metrics-prometheus.yaml
