# Argo CD: OpenBao in dev mode, the k3d example's secret store (in-memory, self-seeding).
# Values: values.yaml next to this file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-openbao
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  sources:
    - repoURL: ghcr.io/openbao/charts
      chart: openbao
      targetRevision: "0.25.6" # version: openbao
      helm:
        releaseName: openbao
        valueFiles:
          - $values/argocd/clusters/k3d-single/k3d/openbao/values.yaml
    - repoURL: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
      targetRevision: main
      ref: values
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
