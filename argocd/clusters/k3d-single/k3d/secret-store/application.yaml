# Argo CD: ClusterSecretStores "default" (secrets the units read; keys:
# `scripts/seed-secrets.sh list`) and "trust" (CA certificates for the trust relay), both
# backed by the in-cluster OpenBao.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      path: argocd/clusters/k3d-single/k3d/secret-store/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
