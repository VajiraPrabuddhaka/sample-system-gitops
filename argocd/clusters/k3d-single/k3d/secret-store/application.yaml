# Argo CD: ClusterSecretStore "default" backed by the in-cluster OpenBao. Every OpenChoreo
# unit reads secrets through a store with this name (keys: `scripts/seed-secrets.sh list`).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
      targetRevision: main
      path: argocd/clusters/k3d-single/k3d/secret-store/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
