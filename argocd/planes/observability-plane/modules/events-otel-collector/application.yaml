# Argo CD: observability module events-otel-collector.
# Values: values.yaml next to this file; a cluster appends its own file to valueFiles
# (argocd/clusters/<name>/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-obs-events-otel-collector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "61"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-observability-plane
  sources:
    - repoURL: cr.openchoreo.dev/openchoreo/helm-charts
      chart: observability-events-otel-collector
      targetRevision: "0.2.1" # version: obs-events-otel-collector
      helm:
        releaseName: observability-events-otel-collector
        valueFiles:
          - $values/argocd/planes/observability-plane/modules/events-otel-collector/values.yaml
    - repoURL: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
      targetRevision: main
      ref: values
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
