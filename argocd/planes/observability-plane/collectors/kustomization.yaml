# argocd/planes/observability-plane/collectors: ship a cluster's telemetry to an
# observability plane that runs on another cluster (the observability plane's own
# cluster uses ../modules instead).
# The cluster's root app applies all four Applications; a cluster that wants fewer lists the
# subdirectories it wants instead (events needs logs-opensearch, which brings the
# namespace and the OpenSearch credentials).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - logs-opensearch
  - traces-opensearch
  - metrics-prometheus
  - events-otel-collector
