# Argo CD: ClusterObservabilityPlane "default" + the agent CA it trusts. Applied on the CONTROL-PLANE
# cluster, wherever the observability plane itself runs. Healthy once its agent connects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-observability-plane-registration
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "70"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      path: argocd/planes/observability-plane/registration/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
