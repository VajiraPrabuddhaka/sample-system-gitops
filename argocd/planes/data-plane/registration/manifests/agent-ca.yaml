# Trust relay, control-plane side (2/2): pull the agent CA that the data-plane published
# into a Secret the cluster-gateway reads when the agent connects
# (clientCA.secretKeyRef). The gateway re-reads it on every connection, so a renewed
# agent certificate is picked up without restarts.
# Store: ClusterSecretStore "trust", the one store every cluster of the installation
# shares. Only public CA certificates go through it; everything else uses "default".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-ca-dataplane-default
  namespace: openchoreo-control-plane
spec:
  refreshInterval: 10m
  secretStoreRef:
    kind: ClusterSecretStore
    name: trust
  target:
    name: agent-ca-dataplane-default
  data:
    - secretKey: ca.crt
      remoteRef:
        key: openchoreo-trust-agent-ca-dataplane-default
        property: value
