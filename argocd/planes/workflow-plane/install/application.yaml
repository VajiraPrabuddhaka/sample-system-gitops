# Argo CD: OpenChoreo workflow plane (+ trust relay).
# Values: values.yaml next to this file; a cluster appends its own file to valueFiles
# (argocd/clusters/<name>/kustomization.yaml).
# Also applies argocd/planes/workflow-plane/install/manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-workflow-plane
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "50"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openchoreo-workflow-plane
  sources:
    - repoURL: cr.openchoreo.dev/openchoreo/helm-charts
      chart: openchoreo-workflow-plane
      targetRevision: "1.4.0-m.1" # version: workflow-plane
      helm:
        releaseName: openchoreo-workflow-plane
        valueFiles:
          - $values/argocd/planes/workflow-plane/install/values.yaml
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      path: argocd/planes/workflow-plane/install/manifests
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs too large for client-side apply
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
