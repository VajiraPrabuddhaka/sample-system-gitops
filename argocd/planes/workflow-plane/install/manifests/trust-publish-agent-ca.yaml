# Trust relay, plane side (2/2): publish this agent's CA (public cert only) so the
# control plane can verify the agent's client certificate. The chart's agent cert is
# self-signed and rotates its key on renewal; re-publishing keeps the control plane's
# copy current. The remote key encodes <planeType>-<planeID>: if you change
# clusterAgent.planeID, patch remoteKey (and the matching registration) too.
# Store: ClusterSecretStore "trust", the one store every cluster of the installation
# shares. Only public CA certificates go through it; everything else uses "default".
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cluster-agent-ca
  namespace: openchoreo-workflow-plane
spec:
  refreshInterval: 10m
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: trust
  selector:
    secret:
      name: cluster-agent-tls
  template:
    engineVersion: v2
    data:
      value: '{{ dict "value" (index . "ca.crt" | toString) | toJson }}'
  data:
    - match:
        secretKey: value
        remoteRef:
          remoteKey: openchoreo-trust-agent-ca-workflowplane-default
