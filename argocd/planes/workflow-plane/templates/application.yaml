# Argo CD: Argo Workflows ClusterWorkflowTemplates every workflow plane needs (checkout + build).
# The registry-specific steps (publish-image, generate-workload) come from the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-workflow-templates
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/REPLACE_ME_GITHUB_ORG/sample-system-gitops.git
      targetRevision: main
      path: argocd/planes/workflow-plane/templates/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
