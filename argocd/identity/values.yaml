# ThunderID (default identity provider). Everything else it needs is cluster-specific
# (public URL, hostnames, OAuth clients and redirect URIs), so it lives in
# clusters/<name>/values/thunder.yaml.
#
# Argo CD: the chart creates its PVCs as Helm pre-install hooks (weight -15) and the setup
# Job that mounts them as a later one (weight -5). Argo CD runs them as PreSync hooks, one
# wave per weight, and waits for each wave to be Healthy before the next. A PVC on a
# WaitForFirstConsumer storage class (k3s local-path, most cloud defaults) stays Pending
# until a pod uses it, so the sync would wait forever before ever starting the setup Job.
# Putting the PVCs in the Job's wave lets the Job's pod bind them.
# Argo CD also runs pre-install hooks on every sync, deleting and re-creating them first
# by default: for the PVCs that would wipe ThunderID's data and block while its pod still
# uses them. The HookFailed delete policy keeps them across syncs. Helm (Flux) ignores
# both annotations.
persistence:
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/hook-delete-policy: HookFailed
certs:
  persistence:
    annotations:
      argocd.argoproj.io/sync-wave: "-5"
      argocd.argoproj.io/hook-delete-policy: HookFailed
secrets:
  persistence:
    annotations:
      argocd.argoproj.io/sync-wave: "-5"
      argocd.argoproj.io/hook-delete-policy: HookFailed

# Argo CD: the HTTPRoute attaches to the control plane's Gateway (values/thunder.yaml),
# which the control plane unit creates later. Argo CD reports an HTTPRoute Progressing
# until a Gateway accepts it, so ThunderID would never turn Healthy and the control plane
# would never start. Leave the route out of ThunderID's health; it is accepted once the
# control plane's Gateway exists.
httproute:
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
