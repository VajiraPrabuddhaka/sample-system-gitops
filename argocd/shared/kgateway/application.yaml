# Argo CD: kgateway CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-kgateway-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kgateway-system
  sources:
    - repoURL: cr.kgateway.dev/kgateway-dev/charts
      chart: kgateway-crds
      targetRevision: "v2.3.11" # version: kgateway-crds
      helm:
        releaseName: kgateway-crds
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs too large for client-side apply
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# Argo CD: kgateway, the Gateway API implementation behind every plane gateway.
# Values: values.yaml next to this file; a cluster appends its own file to valueFiles
# (argocd/clusters/<name>/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-kgateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: kgateway-system
  sources:
    - repoURL: cr.kgateway.dev/kgateway-dev/charts
      chart: kgateway
      targetRevision: "v2.3.11" # version: kgateway
      helm:
        releaseName: kgateway
        valueFiles:
          - $values/argocd/shared/kgateway/values.yaml
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      ref: values
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
