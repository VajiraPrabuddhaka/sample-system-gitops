# Argo CD: Gateway API standard CRDs, straight from the upstream repo at a pinned tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-gateway-api-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  sources:
    - repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: v1.5.1 # version: gateway-api-crds
      path: config/crd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs too large for client-side apply
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
