# Argo CD: External Secrets Operator, which syncs secrets from the ClusterSecretStore
# "default" and runs the trust relay.
# Values: values.yaml next to this file; a cluster appends its own file to valueFiles
# (argocd/clusters/<name>/kustomization.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openchoreo-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  sources:
    - repoURL: ghcr.io/external-secrets/charts
      chart: external-secrets
      targetRevision: "2.0.1" # version: external-secrets
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/argocd/shared/external-secrets/values.yaml
    - repoURL: https://github.com/vajiraprabuddhaka/sample-system-gitops.git
      targetRevision: main
      ref: values
  # cert-manager and ESO inject CA bundles into webhooks and CRD conversion configs;
  # don't report (or revert) that as drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # CRDs too large for client-side apply
      - RespectIgnoreDifferences=true
    retry:
      limit: -1 # keep retrying: other units (or clusters) may still be converging
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
