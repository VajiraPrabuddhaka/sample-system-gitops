# Argo CD only: the public OCI Helm registries the Applications pull charts from.
# Argo CD needs OCI registries declared as repositories (enableOCI); these Secrets do it
# declaratively, so a stock Argo CD install needs no repository setup. No credentials.
apiVersion: v1
kind: Secret
metadata:
  name: openchoreo-helm-openchoreo
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
stringData:
  name: openchoreo-openchoreo
  type: helm
  enableOCI: "true"
  url: cr.openchoreo.dev/openchoreo/helm-charts
---
